name: publish-image

# On every push to main, build web.Dockerfile and publish it to GitHub
# Container Registry as ghcr.io/<owner>/family-hub, so a deploy box can pull a
# ready-made image instead of building from source. Tags: `latest` (the
# newest main), the short commit SHA (to pin or roll back), and the VERSION
# file's number. Only the `web` service ships; the image bakes the example
# config, never a real one (see web.Dockerfile).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the one job asks for package-write itself. Third-party
# actions are pinned to a full commit SHA, the comment names the tag it came from.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        run: echo "number=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=raw,value=${{ steps.version.outputs.number }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: web.Dockerfile
          # amd64 only: the image runs on the NAS. The Pi/iPad/Surface
          # displays just open the wall in a browser.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
